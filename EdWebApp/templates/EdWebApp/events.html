{% extends 'EdWebApp/base.html' %}
{% load static %}
{% load cloudinary %}

{% block title %}
Events - JC Ed Board
{% endblock %}

{% block stylesheets %}
<link rel="stylesheet" type="text/css" href="{% static 'EdWebApp/CSSFiles/events.css' %}">
{% endblock %}

{% block main %}
    <h1 class="mt-1" data-aos="fade-in">Events</h1>
    <div class="container">
      {% for event in events %}
        <div class="row text-center">
            <div class="{% cycle 'order-2 first col-8 col-md-9' 'order-1 first col-8 col-md-9' %}">
                <a href="{% url 'EdWebApp:event_info_view' event.pk %}">
                {{event.title}}
            </a>
            </div>

            <div class="{% cycle 'order-1 second col-4 col-md-3' 'order-2 first col-4 col-md-3' %}" onclick="change_order(this)">
                <img data-src="{{event.preview_image.url}}" class="rounded-circle lazy" width="70%" alt="{{event.title}}">
            </div>
        </div>
      {% endfor %}

    </div>

{% endblock %}


{% block scripts %}
  <script>
    function change_order(arg){
        var clname=arg.className;
        if(clname[6]=="1"){
            clname_new=clname.replace("1","2")
        }
        else{
            clname_new=clname.replace("2","1");
        }
        arg.className=clname_new;
    }
  </script>
  <script>
    AOS.init({duration: 1000,
  		disable: window.orientation==90 || window.orientation==-90,
  	});
  	AOS.refresh();
  </script>
{% endblock %}
