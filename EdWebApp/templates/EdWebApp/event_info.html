{% extends 'EdWebApp/base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" type="text/css" href="{% static 'EdWebApp/CSSFiles/event_info.css' %}">
{% endblock %}

{% block main %}
<div class="container pt-5 mt-5">
    <div class="row mt-5">
        <div id="carouselExampleControls" class="carousel slide poster col-md-12" data-ride="carousel">
            <div class="carousel-inner">
              {% for photo in photos %}
              <div class="carousel-item {{forloop.counter}} {% if forloop.first %} active {% endif %}">
                <img class="d-block w-100" src="{{photo.images.url}}" alt="{{events.title}}">
              </div>
              {% endfor %}
            </div>
            <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="sr-only">Next</span>
            </a>
			  </div>
		</div>
		<div class="row">
			<div class="logo col-5 col-sm-4 col-md-3">
        <!--Correct this-->
				<img src="{% static 'EdWebApp/images/logo.svg' %}">
			</div>
		<div>
		<div class="row">
			<div class="content px-5 py-5">
        <div class="col-md-12 text-center">
          <h1>{{events.title}}</h1>
        </div>
				{{events.description}}
			</div>
		</div>
  </div>
{% endblock %}
