{% extends 'EdWebApp/base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" type="text/css" href="{% static 'EdWebApp/CSSFiles/event_info.css' %}">
{% endblock %}

{% block main %}
<div class="container">
	<div class="row carousel_row">
        	<div id="event_carousel" class="carousel slide poster col-md-12" data-ride="carousel">
           		<div class="carousel-inner rounded">
              			{% for photo in photos %}
              			<div class="carousel-item {% if forloop.first %} active {% endif %}">
											<div class="d-flex justify-content-center">
												<img class="d-block group_img" src="{{photo.images.url}}" alt="{{events.title}}">
											</div>
										</div>
              			{% endfor %}
            		</div>
								<a class="carousel-control-prev" href="#event_carousel" data-slide="prev">
					      	<span class="carousel-control-prev-icon"></span>
					    	</a>
					    	<a class="carousel-control-next" href="#event_carousel" data-slide="next">
					      	<span class="carousel-control-next-icon"></span>
					    	</a>
		</div>
	</div>
</div>
<div class="container pl-5 pr-5">
	<div class="row logo_row">
		<div class="col-5">
			<p class="float-right headings_event">{{events.title1}}</p>
		</div>
		<div class="col-2 d-flex justify-content-center">
			<figure>
				<img src="{% static 'EdWebApp/images/logo.svg' %}" class="rounded-circle border border-white logo_circle" style="height: 15vw; z-index: 1;">
			</figure>
		</div>
		<div class="col-5">
			<p class="float-left headings_event">{{events.title2}}</p>
		</div>
	</div>
</div>
<div>
	<div class="container">
		<div class="card ml-3 mr-3 p-4 content_card">
			{{events.description|linebreaks|urlize}}
		</div>
	</div>
</div>
{% endblock %}
