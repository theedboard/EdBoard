{% extends 'EdWebApp/base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" type="text/css" href="{% static 'EdWebApp/CSSFiles/event_info.css' %}">
{% endblock %}

{% block main %}
<div class="container d-flex">
	<div class="row carousel_row d-flex justify-content-center">
        	<div id="event_carousel" class="carousel slide poster col-md-12" data-ride="carousel">
           		<div class="carousel-inner rounded">
              			{% for photo in photos %}
              			<div class="carousel-item {{forloop.counter}} {% if forloop.first %} active {% endif %}">
                			<img class="d-block w-100 group_img" src="{{photo.images.url}}" alt="{{events.title}}">
              			</div>
              			{% endfor %}
            		</div>
            		<a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
              			<span class="carousel-control-prev-icon" aria-hidden="true"></span>
              			<span class="sr-only">Previous</span>
            		</a>
            		<a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
              			<span class="carousel-control-next-icon" aria-hidden="true"></span>
              			<span class="sr-only">Next</span>
            		</a>
		</div>
	</div>
</div>
<div class="container pl-5 pr-5">
	<div class="row logo_row">
		<div class="col-5">
			<p class="float-right headings_event">{{events.title1}}</p>
		</div>
		<div class="col-2 d-flex justify-content-center">
			<figure>
				<img src="{% static 'EdWebApp/images/logo.svg' %}" class="rounded-circle border border-white logo_circle" style="height: 15vw; z-index: 1;">
			</figure>
		</div>
		<div class="col-5">
			<p class="float-left headings_event">{{events.title2}}</p>
		</div>
	</div>
</div>
<div>
	<div class="container">
		<div class="card ml-3 mr-3 p-4 content_card">
			{{events.description}}
		</div>
	</div>
</div>
{% endblock %}
